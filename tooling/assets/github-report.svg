<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="gh-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- macOS Squircle Background -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#gh-grad)" filter="url(#shadow)" />
  
  <!-- Inner Rim Border -->
  <rect x="68" y="68" width="888" height="888" rx="196" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8" />

  <!-- GitHub Report Logo: Git Branch & Report Metric Bars -->
  <g transform="translate(512, 512)">
    <!-- Report Metrics Bars (Background) -->
    <rect x="-180" y="20" width="60" height="140" rx="16" fill="rgba(255,255,255,0.35)" />
    <rect x="-80" y="-60" width="60" height="220" rx="16" fill="rgba(255,255,255,0.45)" />
    <rect x="20" y="-140" width="60" height="300" rx="16" fill="rgba(255,255,255,0.55)" />
    <rect x="120" y="-200" width="60" height="360" rx="16" fill="rgba(255,255,255,0.75)" />

    <!-- Git Pull Request / Commit Nodes Overlaid -->
    <path d="M-150,140 L-50,-20 L50,-100 L150,-160" fill="none" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-150" cy="140" r="32" fill="#38bdf8" stroke="white" stroke-width="12" />
    <circle cx="-50" cy="-20" r="32" fill="#38bdf8" stroke="white" stroke-width="12" />
    <circle cx="50" cy="-100" r="32" fill="#38bdf8" stroke="white" stroke-width="12" />
    <circle cx="150" cy="-160" r="40" fill="#f0f9ff" stroke="white" stroke-width="12" />
  </g>
</svg>
