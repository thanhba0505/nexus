name: Release Ecosystem

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Tạo bản Release ở dạng Nháp (Draft)'
        required: true
        type: boolean
        default: true
      tag:
        description: 'Git Tag (để trống nếu muốn tự động tính version)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine & Bump Versions
        id: bump
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Kích hoạt bằng Git Tag: ${{ github.ref_name }}"
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "draft=false" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "Đang kiểm tra thay đổi và tự động tính toán phiên bản..."
            BUMP_OUT=$(node tooling/scripts/bump-versions.mjs)
            echo "$BUMP_OUT"

            IS_BUMPED=$(echo "$BUMP_OUT" | node -e "const data = JSON.parse(require('fs').readFileSync(0, 'utf-8')); console.log(data.bumped);")

            if [ "$IS_BUMPED" = "true" ]; then
              NEW_TAG=$(echo "$BUMP_OUT" | node -e "const data = JSON.parse(require('fs').readFileSync(0, 'utf-8')); console.log(data.tag);")
              echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
              echo "draft=true" >> $GITHUB_OUTPUT
              echo "should_release=true" >> $GITHUB_OUTPUT

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add apps.json apps/*/package.json apps/*/src-tauri/tauri.conf.json
              git commit -m "chore(release): bump version to $NEW_TAG [skip ci]"
              git push origin main
            else
              echo "Không có thay đổi trong apps/ hoặc packages/, bỏ qua release."
              echo "should_release=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Build All Desktop Apps (.dmg & .app)
        if: steps.bump.outputs.should_release == 'true'
        run: |
          echo "Biên dịch Nexus Launcher..."
          pnpm desktop:build:nexus

          echo "Biên dịch SlackBot..."
          pnpm desktop:build:slackbot

          echo "Biên dịch GitHub Report..."
          pnpm desktop:build:github-report

      - name: Prepare Release Assets
        if: steps.bump.outputs.should_release == 'true'
        run: |
          mkdir -p release-artifacts
          for f in target/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] || continue
            filename=$(basename "$f" | tr ' ' '_')
            cp "$f" "release-artifacts/$filename"
          done
          cp apps.json release-artifacts/
          echo "Danh sách các file trong release-artifacts:"
          ls -la release-artifacts

      - name: Publish GitHub Draft Release
        if: steps.bump.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: "${{ steps.bump.outputs.tag }} Nexus Ecosystem"
          draft: ${{ steps.bump.outputs.draft == 'true' }}
          prerelease: false
          files: release-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
