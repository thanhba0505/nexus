name: Build & Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag của Release cần đóng gói (ví dụ: v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  compile-and-publish:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All 3 Desktop Apps (.dmg)
        run: |
          echo "Biên dịch Nexus Launcher..."
          pnpm desktop:build:nexus

          echo "Biên dịch SlackBot..."
          pnpm desktop:build:slackbot

          echo "Biên dịch GitHub Report..."
          pnpm desktop:build:github-report

      - name: Prepare Artifacts
        run: |
          mkdir -p release-artifacts
          for f in target/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] || continue
            filename=$(basename "$f" | tr ' ' '_')
            cp "$f" "release-artifacts/$filename"
          done
          cp apps.json release-artifacts/
          echo "Danh sách các file trong release-artifacts:"
          ls -la release-artifacts

      - name: Upload Artifacts to Release
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          echo "Uploading artifacts to release $TAG_NAME..."
          gh release upload "$TAG_NAME" release-artifacts/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
