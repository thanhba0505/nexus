name: 🚀 Build & Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag của Release cần đóng gói (ví dụ: v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write
  pull-requests: write

jobs:
  compile-and-publish:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All 3 Desktop Apps (.dmg)
        run: |
          mkdir -p release-artifacts

          echo "Biên dịch Nexus Launcher..."
          pnpm build:nexus
          for f in target/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] || continue
            dest="release-artifacts/$(basename "$f" | tr ' ' '_')"
            cp "$f" "$dest"
          done

          echo "Biên dịch SlackBot..."
          pnpm build:slackbot
          for f in target/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] || continue
            cp "$f" "release-artifacts/$(basename "$f" | tr ' ' '_')"
          done

          echo "Biên dịch GitHub Report..."
          pnpm build:github-report
          for f in target/release/bundle/dmg/*.dmg; do
            [ -f "$f" ] || continue
            cp "$f" "release-artifacts/$(basename "$f" | tr ' ' '_')"
          done

      - name: Prepare Artifacts
        run: |
          cp apps.json release-artifacts/
          echo "Danh sách các file trong release-artifacts:"
          ls -la release-artifacts

      - name: Upload Artifacts to Release
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          echo "Uploading artifacts to release $TAG_NAME..."
          gh release upload "$TAG_NAME" release-artifacts/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README.md with Published Release Details
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          BRANCH_NAME="chore/update-readme-${TAG_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch nhánh main mới nhất để cập nhật tài liệu trên commit mới nhất
          git fetch origin main
          git checkout -B "$BRANCH_NAME" origin/main

          python3 -c "
          import re, os
          from pathlib import Path

          readme = Path('README.md')
          if not readme.exists():
              exit(0)

          tag = os.environ.get('TAG_NAME', '').strip()
          if not tag:
              exit(0)

          version = tag.lstrip('v')
          dmg = f'Nexus_{version}_aarch64.dmg'
          repo = os.environ.get('GITHUB_REPOSITORY', 'thanhba0505/nexus')
          url = f'https://github.com/{repo}/releases/download/{tag}/{dmg}'

          content = readme.read_text(encoding='utf-8')
          new_section = (
              '> 💡 **Bấm trực tiếp vào nút bên dưới để tải ngay file cài đặt \`.dmg\` về máy (Direct Download)**:\n\n'
              '<p align=\"center\">\n'
              f'  <a href=\"{url}\">\n'
              '    <img src=\"https://img.shields.io/badge/⬇️_Tải_Ngay_Nexus_cho_macOS-(Apple_Silicon_.dmg)-0ea5e9?style=for-the-badge&logo=apple&logoColor=white\" height=\"42\" alt=\"Tải Ngay Nexus cho macOS\" />\n'
              '  </a>\n'
              '</p>\n\n'
              '| Thông Tin Phát Hành | Chi Tiết |\n'
              '| :--- | :--- |\n'
              f'| 🏷️ **Phiên Bản Hiện Tại** | \`{tag}\` |\n'
              f'| 📦 **Tệp Cài Đặt Khuyên Dùng** | [\`{dmg}\`]({url}) |\n'
              '| ⚡ **Cách Thức Tải** | **Tải Trực Tiếp (Direct Download)** — Trình duyệt tự tải file về, không cần qua trang trung gian |\n'
              f'| 📋 **Xem Chi Tiết Bản Phát Hành** | [📦 Xem GitHub Releases & Changelog](https://github.com/{repo}/releases/latest) |'
          )

          content = re.sub(
              r'<!-- NEXUS_DOWNLOAD_SECTION_START -->[\s\S]*?<!-- NEXUS_DOWNLOAD_SECTION_END -->',
              f'<!-- NEXUS_DOWNLOAD_SECTION_START -->\n{new_section}\n<!-- NEXUS_DOWNLOAD_SECTION_END -->',
              content,
          )
          readme.write_text(content, encoding='utf-8')
          print(f'✅ Đã cập nhật README.md cho phiên bản {tag} với tệp {dmg}')
          "

          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): update README download link to $TAG_NAME [skip ci]"

            echo "🚀 Đang thử push trực tiếp lên main..."
            if git push origin "HEAD:main"; then
              echo "✅ Đã push trực tiếp lên main thành công!"
            else
              echo "⚠️ Push trực tiếp lên main bị chặn bởi Branch Protection. Tự động tạo Pull Request..."
              git push origin "$BRANCH_NAME" --force
              PR_URL=$(gh pr create \
                --title "chore(release): update README download link to ${TAG_NAME}" \
                --body "Tự động cập nhật link tải và thông tin phiên bản trong README.md cho ${TAG_NAME}." \
                --base main \
                --head "$BRANCH_NAME" || true)
              echo "📋 PR đã được tạo: $PR_URL"
              gh pr merge "$BRANCH_NAME" --auto --squash || true
            fi
          else
            echo "ℹ️ README.md đã ở trạng thái mới nhất, không cần cập nhật."
          fi
        env:
          TAG_NAME: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
