<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <g transform="rotate(0 64 64)">
      <!-- Back Hair Bob -->
      <ellipse cx="64" cy="56" rx="32" ry="30" fill="#f472b6"/>
      <path d="M 32,56 Q 30,84 44,86 L 84,86 Q 98,84 96,56 Z" fill="#f472b6"/>

      <!-- Legs -->
      <ellipse cx="48" cy="116" rx="9" ry="5" fill="#78350f"/>
      <ellipse cx="80" cy="116" rx="9" ry="5" fill="#78350f"/>

      <!-- Dress Body (Eden Academy Black & Gold) -->
      <path d="M 48,78 L 38,106 Q 64,110 90,106 L 80,78 Z" fill="#1e1e24"/>
      <!-- Gold Trim on Dress Bottom -->
      <path d="M 39,104 Q 64,108 89,104" stroke="#fbbf24" stroke-width="2.5" fill="none"/>
      <!-- White Shirt Collar -->
      <polygon points="56,78 64,86 72,78" fill="#f8fafc"/>
      <polygon points="61,78 64,83 67,78" fill="#e11d48"/>

      <!-- Arms -->
      <path d="M 46,78 Q 42,88 52,94" stroke="#1e1e24" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M 82,78 Q 86,88 76,94" stroke="#1e1e24" stroke-width="7" stroke-linecap="round" fill="none"/>

      <!-- Head & Face -->
      <ellipse cx="64" cy="48" rx="27" ry="24" fill="#fee2e2"/>
      <!-- Cheeks Blush -->
      <ellipse cx="44" cy="59" rx="5" ry="3" fill="#f43f5e" opacity="0.45"/>
      <ellipse cx="84" cy="59" rx="5" ry="3" fill="#f43f5e" opacity="0.45"/>

      <!-- Eyes & Mouth -->
      
      <!-- Peaceful sleeping curved eyes -->
      <path d="M 42,53 Q 50,59 58,53" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 70,53 Q 78,59 86,53" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
      
      <ellipse cx="64" cy="65" rx="2" ry="2" fill="#0f172a"/>
      <text x="88" y="40" font-family="sans-serif" font-weight="bold" font-size="12" fill="#38bdf8">Z</text>
      <text x="96" y="30" font-family="sans-serif" font-weight="bold" font-size="10" fill="#38bdf8">z</text>
      <text x="102" y="22" font-family="sans-serif" font-weight="bold" font-size="8" fill="#38bdf8">z</text>
    

      <!-- Front Hair Bangs -->
      <path d="M 36,42 Q 40,58 46,48 Q 54,60 60,46 Q 66,60 74,48 Q 80,58 86,42 Q 92,22 64,24 Q 36,22 36,42 Z" fill="#f9a8d4"/>
      <!-- Side Strands -->
      <path d="M 37,44 Q 32,68 38,76 Q 42,64 41,50" fill="#f9a8d4"/>
      <path d="M 91,44 Q 96,68 90,76 Q 86,64 87,50" fill="#f9a8d4"/>

      <!-- Anya Hair Horn Ornaments (Cones) -->
      <!-- Left Horn -->
      <polygon points="34,34 24,20 42,26" fill="#1e1e24"/>
      <polygon points="32,33 25,22 30,24" fill="#fbbf24"/>
      <!-- Right Horn -->
      <polygon points="94,34 104,20 86,26" fill="#1e1e24"/>
      <polygon points="96,33 103,22 98,24" fill="#fbbf24"/>
    </g>
  </svg>