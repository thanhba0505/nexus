<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background Gradient (matching Nexus #0ea5e9 gradient) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gloss Highlight Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10" />
    </linearGradient>

    <!-- Squircle Shadow -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.32" />
    </filter>

    <!-- Icon Drop Shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0369a1" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- macOS Squircle Body with Shadow (824x824 at 100, 100 with rx=185) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bgGradient)" filter="url(#squircleShadow)" />

  <!-- Inner Stroke / Border -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#borderGradient)" stroke-width="4" />

  <!-- GitPullRequest Icon from Lucide (scaled 18.5x, centered at 512, 512) -->
  <!-- 24 * 18.5 = 444px. Origin: 512 - 222 = 290 -->
  <g transform="translate(290, 290) scale(18.5)" filter="url(#iconShadow)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="18" r="3" />
    <circle cx="6" cy="6" r="3" />
    <path d="M13 6h3a2 2 0 0 1 2 2v7" />
    <line x1="6" y1="9" x2="6" y2="21" />
  </g>
</svg>